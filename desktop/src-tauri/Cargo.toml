[package]
name = "virtual-shot-desktop"
version = "0.0.0"
description = "Spike: the Virtual Shot editor in a Tauri window, with the local server ported to Rust"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
percent-encoding = "2"
tiny_http = "0.12.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
