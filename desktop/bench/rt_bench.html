<!doctype html><meta charset="utf-8"><title>Ray-tracing probe (browser)</title>
<pre id="out">running…</pre>
<script type="module">
// The browser half of desktop/rt-probe: the same software-BVH WGSL, BVH, triangles and params (written by the probe
// to desktop/bench/rt_data/ with --browser=), run through WebGPU and timed with timestamp queries. WebGPU has no
// hardware ray tracing, so this is what a browser build would use. Results in window.PROBE.
const q = new URLSearchParams(location.search), REPS = +(q.get('reps') || 10), KS = (q.get('k') || '0,3,5').split(',');
const W = 1920, H = 1080, D = '/desktop/bench/rt_data/';
const bin = async p => new Uint8Array(await (await fetch(D + p)).arrayBuffer());
async function run() {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const device = await adapter.requestDevice({ requiredFeatures: ['timestamp-query'],
    requiredLimits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize } });
  const module = device.createShaderModule({ code: await (await fetch(D + 'sw.wgsl')).text() });
  const info = await module.getCompilationInfo(); if (info.messages.some(m => m.type === 'error')) throw new Error(info.messages.map(m => m.message).join('\n'));
  const pipe = await device.createComputePipelineAsync({ layout: 'auto', compute: { module, entryPoint: 'main' } });
  const buf = (data, usage) => { const b = device.createBuffer({ size: Math.ceil(data.byteLength / 4) * 4, usage: usage | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(b, 0, data); return b; };
  const out = { ua: navigator.userAgent, limits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize }, runs: [] };
  const obuf = device.createBuffer({ size: W * H * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const rbuf = device.createBuffer({ size: W * H * 16, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  for (const k of KS) {
    const P = buf(await bin(`params_k${k}.bin`), GPUBufferUsage.UNIFORM), T = buf(await bin(`tris_k${k}.bin`), GPUBufferUsage.STORAGE), N = buf(await bin(`nodes_k${k}.bin`), GPUBufferUsage.STORAGE);
    const bind = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: P } }, { binding: 1, resource: { buffer: T } },
      { binding: 2, resource: { buffer: obuf } }, { binding: 3, resource: { buffer: N } }] });
    const qs = device.createQuerySet({ type: 'timestamp', count: 2 * REPS });
    const qres = device.createBuffer({ size: 16 * REPS, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
    const qread = device.createBuffer({ size: 16 * REPS, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const dispatch = r => { const e = device.createCommandEncoder(); const c = e.beginComputePass(r == null ? {} : { timestampWrites: { querySet: qs, beginningOfPassWriteIndex: 2 * r, endOfPassWriteIndex: 2 * r + 1 } });
      c.setPipeline(pipe); c.setBindGroup(0, bind); c.dispatchWorkgroups(Math.ceil(W / 8), Math.ceil(H / 8)); c.end(); device.queue.submit([e.finish()]); };
    for (let i = 0; i < 3; i++) dispatch(); await device.queue.onSubmittedWorkDone();
    for (let r = 0; r < REPS; r++) dispatch(r);
    const e = device.createCommandEncoder(); e.resolveQuerySet(qs, 0, 2 * REPS, qres, 0); e.copyBufferToBuffer(qres, 0, qread, 0, 16 * REPS); e.copyBufferToBuffer(obuf, 0, rbuf, 0, W * H * 16); device.queue.submit([e.finish()]);
    await qread.mapAsync(GPUMapMode.READ); const ts = new BigUint64Array(qread.getMappedRange().slice(0)); qread.unmap();
    await rbuf.mapAsync(GPUMapMode.READ); const px = new Float32Array(rbuf.getMappedRange()); let lit = 0; for (let i = 0; i < W * H; i++) lit += px[i * 4]; rbuf.unmap();
    const ms = []; for (let r = 0; r < REPS; r++) ms.push(Number(ts[2 * r + 1] - ts[2 * r]) / 1e6); ms.sort((a, b) => a - b);
    out.runs.push({ k: +k, median_ms: +ms[REPS >> 1].toFixed(3), min_ms: +ms[0].toFixed(3), mean_light: +(lit / (W * H)).toFixed(6) });
    P.destroy(); T.destroy(); N.destroy();
  }
  return out;
}
run().then(r => { window.PROBE = r; window.VS_READY = true; document.getElementById('out').textContent = JSON.stringify(r, null, 1); })
  .catch(e => { window.VS_ERROR = String(e.stack || e); document.getElementById('out').textContent = window.VS_ERROR; });
</script>
