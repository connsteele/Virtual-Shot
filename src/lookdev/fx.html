<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX Look Dev</title>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.webgpu.js",
  "three/webgpu": "/node_modules/three/build/three.webgpu.js",
  "three/tsl": "/node_modules/three/build/three.tsl.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<style>
  :root { color-scheme: dark; --bg: #141314; --fg: #ecefeb; --muted: #8d8a8e; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100%; max-width: 1920px; height: auto; aspect-ratio: 16 / 9; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 8px 16px; flex-wrap: wrap; }
  .bar .note { color: var(--muted); }
</style>
</head>
<body>
<div class="bar"><strong>FX look dev</strong>
  <label>Age <input type="range" id="age" min="0" max="3.5" step="0.01" value="0.4"></label>
  <label><input type="checkbox" id="light"> Particle light</label>
  <label>Lighting <select id="lighting"><option>day</option><option>dusk</option><option>night</option></select></label>
  <label>Smoke <select id="smoke"><option>off</option><option>unsorted</option><option>sorted</option><option>wboit</option></select></label>
  <span class="note" id="info">Loading…</span></div>
<canvas id="gpu" width="1920" height="1080"></canvas>
<script type="module" src="./fx.js"></script>
</body>
</html>
